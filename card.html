<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Someone mailed you a postcard from somewhere real." />
<title>You've got a postcard</title>

<meta property="og:title" content="You've got a postcard" />
<meta property="og:description" content="Someone mailed you a postcard from somewhere real." />
<!-- TODO(v1.8 §3): replace with the real production domain (from APP_BASE_URL) before deploying. -->
<meta property="og:image" content="https://YOUR-PRODUCTION-DOMAIN/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="/assets/paper-card-v2.jpg">
<link rel="stylesheet" href="/css/shared.css" />
<link rel="stylesheet" href="/css/card.css" />
</head>
<body>

<main class="stage" id="stage">

  <div class="state" id="state-damaged">
    <div class="damaged-card">
      <div class="damaged-headline">This one got damaged in the mail.</div>
      <div class="damaged-body">The postcard in this link isn't intact, so it can't be shown. Ask the sender for a fresh link.</div>
    </div>
  </div>

  <div class="state" id="state-arrival">
    <div class="envelope-scene">
      <div class="card-wrap"></div>
      <div class="envelope">
        <div class="envelope-texture" aria-hidden="true"></div>
        <div class="envelope-address">POST CARD</div>
        <div class="envelope-to-name" id="envelopeToName"></div>
        <div class="envelope-seal">
          <div class="seal-half seal-half-left"></div>
          <div class="seal-half seal-half-right"></div>
          <div class="dust-puff">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
      <p class="stamp-hint-caption" id="stampHintCaption">tap the stamp</p>
    </div>
    <button type="button" class="break-seal-button">Break the seal</button>
    <p class="arrival-meta" id="arrivalMeta"></p>
    <div class="card-footer">
      Mailed with Postmarked — <a href="/">send one back from wherever you are.</a>
    </div>
  </div>

</main>

<div class="zoom-overlay" id="zoomOverlay">
  <div class="zoom-panel" role="dialog" aria-modal="true" aria-label="Stamp and postmark detail">
    <button type="button" class="zoom-close" id="zoomClose" aria-label="Close">✕</button>
    <div class="zoom-stamp-wrap" id="zoomStampWrap"></div>
    <div class="zoom-postmark-wrap" id="zoomPostmarkWrap"></div>
    <div class="zoom-caption-lines" id="zoomCaptionLines"></div>
  </div>
</div>

<script type="module" src="/js/card.js"></script>
</body>
</html>
