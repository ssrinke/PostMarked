<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Someone mailed you a postcard from somewhere real." />
<title>You've got a postcard</title>

<meta property="og:title" content="You've got a postcard" />
<meta property="og:description" content="Someone mailed you a postcard from somewhere real." />
<meta property="og:image" content="/og.png" />

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="/assets/paper-card.jpg">
<link rel="stylesheet" href="/css/shared.css" />
<link rel="stylesheet" href="/css/card.css" />
</head>
<body>

<div class="desk-decor" aria-hidden="true">
  <svg class="decor-stamp-b" viewBox="0 0 90 108" xmlns="http://www.w3.org/2000/svg">
    <rect x="12" y="10" width="70" height="88" rx="2" fill="none" stroke="#A8946E" stroke-width="1.5" stroke-dasharray="3.5 3.5" transform="rotate(8 47 54)"/>
    <rect x="21" y="19" width="52" height="70" fill="none" stroke="#A8946E" stroke-width="1.2" transform="rotate(8 47 54)"/>
  </svg>
  <svg class="decor-stamp-a" viewBox="0 0 90 108" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="70" height="88" rx="2" fill="none" stroke="#A8946E" stroke-width="1.5" stroke-dasharray="3.5 3.5" transform="rotate(-6 45 54)"/>
    <rect x="19" y="19" width="52" height="70" fill="none" stroke="#A8946E" stroke-width="1.2" transform="rotate(-6 45 54)"/>
  </svg>
  <svg class="decor-parlabel" viewBox="0 0 110 24" xmlns="http://www.w3.org/2000/svg">
    <text x="2" y="18" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#A8946E">Par Avion</text>
  </svg>
  <svg class="decor-chevrons" viewBox="0 0 90 20" xmlns="http://www.w3.org/2000/svg">
    <path d="M4,2 L14,11 L4,20" fill="none" stroke="#A8946E" stroke-width="2"/>
    <path d="M38,2 L48,11 L38,20" fill="none" stroke="#A8946E" stroke-width="2"/>
    <path d="M72,2 L82,11 L72,20" fill="none" stroke="#A8946E" stroke-width="2"/>
  </svg>
  <svg class="decor-inkpen" viewBox="0 0 90 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M25,60 L65,60 L60,90 L30,90 Z" fill="none" stroke="#A8946E" stroke-width="1.6"/>
    <ellipse cx="45" cy="60" rx="20" ry="6" fill="none" stroke="#A8946E" stroke-width="1.6"/>
    <rect x="38" y="44" width="14" height="16" fill="none" stroke="#A8946E" stroke-width="1.4"/>
    <line x1="10" y1="20" x2="80" y2="52" stroke="#A8946E" stroke-width="1.8"/>
    <path d="M10,20 L18,18 L12,28 Z" fill="#A8946E" stroke="none"/>
  </svg>
  <svg class="decor-twine" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <path d="M20,60 C20,20 100,20 100,60 C100,100 20,100 20,60 Z" fill="none" stroke="#A8946E" stroke-width="2"/>
    <path d="M35,60 C35,35 85,35 85,60 C85,85 35,85 35,60 Z" fill="none" stroke="#A8946E" stroke-width="1.5"/>
    <rect x="78" y="52" width="22" height="16" rx="1" fill="none" stroke="#A8946E" stroke-width="1.4" transform="rotate(18 89 60)"/>
  </svg>
  <svg class="decor-coffee" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#A8946E" stroke-width="2.2" stroke-dasharray="60 14"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#A8946E" stroke-width="1.6" stroke-dasharray="46 10" transform="rotate(40 50 50)"/>
  </svg>
  <svg class="decor-flower" viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
    <line x1="30" y1="20" x2="30" y2="64" stroke="#A8946E" stroke-width="1.4"/>
    <ellipse cx="18" cy="16" rx="10" ry="6" fill="none" stroke="#A8946E" stroke-width="1.2" transform="rotate(-20 18 16)"/>
    <ellipse cx="42" cy="16" rx="10" ry="6" fill="none" stroke="#A8946E" stroke-width="1.2" transform="rotate(20 42 16)"/>
    <ellipse cx="30" cy="8" rx="10" ry="6" fill="none" stroke="#A8946E" stroke-width="1.2"/>
  </svg>
  <svg class="decor-postmark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#A8946E" stroke-width="2"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="#A8946E" stroke-width="1.5"/>
  </svg>
  <svg class="decor-stars" viewBox="0 0 160 30" xmlns="http://www.w3.org/2000/svg">
    <path d="M12,2 L14.5,9 L22,9 L16,13.5 L18,21 L12,16.5 L6,21 L8,13.5 L2,9 L9.5,9 Z" fill="#A8946E"/>
    <path d="M82,6 L84,11.5 L90,11.5 L85,15 L87,20.5 L82,17 L77,20.5 L79,15 L74,11.5 L80,11.5 Z" fill="#A8946E"/>
    <path d="M148,0 L150.5,7 L158,7 L152,11.5 L154,19 L148,14.5 L142,19 L144,11.5 L138,7 L145.5,7 Z" fill="#A8946E"/>
  </svg>
</div>
<main class="stage" id="stage">

  <div class="state" id="state-damaged">
    <div class="damaged-card">
      <div class="damaged-headline">This one got damaged in the mail.</div>
      <div class="damaged-body">The postcard in this link isn't intact, so it can't be shown. Ask the sender for a fresh link.</div>
    </div>
  </div>

  <div class="state" id="state-arrival">
    <div class="envelope-scene">
      <div class="card-wrap"></div>
      <div class="envelope">
        <div class="envelope-texture" aria-hidden="true"></div>
        <div class="envelope-address">POST CARD</div>
        <div class="envelope-to-name" id="envelopeToName"></div>
        <div class="envelope-seal">
          <div class="seal-half seal-half-left"></div>
          <div class="seal-half seal-half-right"></div>
          <div class="dust-puff">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
      <p class="stamp-hint-caption" id="stampHintCaption">tap the stamp</p>
    </div>
    <button type="button" class="break-seal-button">Break the seal</button>
    <p class="arrival-meta" id="arrivalMeta"></p>
    <div class="card-footer">
      Mailed with Postmarked — <a href="/">send one back from wherever you are.</a>
    </div>
  </div>

</main>

<div class="zoom-overlay" id="zoomOverlay">
  <div class="zoom-panel" role="dialog" aria-modal="true" aria-label="Stamp and postmark detail">
    <button type="button" class="zoom-close" id="zoomClose" aria-label="Close">✕</button>
    <div class="zoom-stamp-wrap" id="zoomStampWrap"></div>
    <div class="zoom-postmark-wrap" id="zoomPostmarkWrap"></div>
    <div class="zoom-caption-lines" id="zoomCaptionLines"></div>
  </div>
</div>

<script type="module" src="/js/card.js"></script>
</body>
</html>
