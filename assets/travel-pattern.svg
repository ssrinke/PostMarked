<svg xmlns="http://www.w3.org/2000/svg" width="260" height="220" viewBox="0 0 260 220">
  <g fill="none" stroke="#9FBFC6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <!-- paper airplane, upper-left -->
    <g transform="translate(28,26) rotate(-12)">
      <path d="M0,14 L34,0 L20,30 L14,18 Z"/>
      <path d="M14,18 L0,14"/>
    </g>
    <!-- dotted flight path trailing the plane -->
    <path d="M2,44 Q40,60 70,40" stroke-dasharray="1.6 6"/>

    <!-- small suitcase, upper-right -->
    <g transform="translate(180,20)">
      <rect x="0" y="10" width="34" height="24" rx="3"/>
      <path d="M11,10 V4 a3,3 0 0 1 3,-3 h6 a3,3 0 0 1 3,3 v6"/>
      <line x1="0" y1="20" x2="34" y2="20"/>
    </g>

    <!-- compass rose, center-left -->
    <g transform="translate(46,120)">
      <circle r="16"/>
      <line x1="0" y1="-16" x2="0" y2="16"/>
      <line x1="-16" y1="0" x2="16" y2="0"/>
      <path d="M0,-10 L4,0 L0,10 L-4,0 Z"/>
    </g>

    <!-- postmark circle + wavy cancel lines, center-right -->
    <g transform="translate(196,128)">
      <circle r="18"/>
      <path d="M-30,-2 h10 M-30,4 h10"/>
    </g>

    <!-- luggage tag, lower-left -->
    <g transform="translate(20,176)">
      <path d="M0,0 L22,0 L30,10 L22,20 L0,20 Z"/>
      <circle cx="7" cy="10" r="2.4"/>
    </g>

    <!-- small hand-drawn star, lower-right -->
    <path d="M214,182 L217,190 L225,190 L219,195 L221,203 L214,198 L207,203 L209,195 L203,190 L211,190 Z" transform="translate(0,0) scale(0.9)" />
  </g>
</svg>
