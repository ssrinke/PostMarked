<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Postmarked development harness — not linked from any page." />
<title>Postmarked — dev harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/shared.css" />
<link rel="stylesheet" href="/css/card.css" />
<style>
  body { padding: 24px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
  .dev-panel { width: 100%; max-width: 900px; background: rgba(0,0,0,0.25); border-radius: 8px; padding: 16px 20px; }
  .dev-panel h1 { font-size: 16px; margin: 0 0 12px; }
  .dev-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .dev-form label { display: flex; flex-direction: column; font-size: 11px; letter-spacing: 0.04em; gap: 4px; }
  .dev-form input, .dev-form textarea { font-family: inherit; padding: 6px; border-radius: 3px; border: 1px solid var(--paper-shade); }
  .dev-form textarea { grid-column: 1 / -1; min-height: 60px; }
  .dev-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .dev-actions button { padding: 8px 14px; border-radius: 3px; border: 1px solid var(--paper-shade); background: var(--paper); }
  .dev-stage { display: flex; justify-content: center; padding: 40px 0; }
  .dev-state-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
</style>
</head>
<body>

<div class="dev-panel">
  <h1>Postmarked — dev harness (unlinked)</h1>
  <form class="dev-form" id="devForm">
    <label>Lat <input name="lat" type="number" step="0.01" value="38.71" /></label>
    <label>Lng <input name="lng" type="number" step="0.01" value="-9.14" /></label>
    <label>Title (old cards only) <input name="ti" type="text" maxlength="40" value="" /></label>
    <label>To <input name="to" type="text" maxlength="30" value="Priya" /></label>
    <label>Ink (0-3) <input name="ink" type="number" min="0" max="3" value="0" /></label>
    <label>Stamp variant (0-1, 2=old→falls back to 0) <input name="sv" type="number" min="0" max="2" value="0" /></label>
    <label>Flower (0=none, 1-4) <input name="fl" type="number" min="0" max="4" value="0" /></label>
    <label>Front id (e.g. meadow-1) <input name="fr" type="text" value="meadow-1" /></label>
    <label>Sender <input name="s" type="text" maxlength="40" value="Sanjana" /></label>
    <label>Weather code <input name="wc" type="number" value="0" /></label>
    <label>Temp °C <input name="wt" type="number" value="34" /></label>
    <label>Place <input name="pl" type="text" value="Lisbon" /></label>
    <label>Country <input name="co" type="text" value="Portugal" /></label>
    <label>Date <input name="d" type="date" value="2026-07-14" /></label>
    <label>Time <input name="t" type="text" value="18:42" /></label>
    <textarea name="m" maxlength="300">Wish you were here — the light this evening is unreal.</textarea>
  </form>
  <div class="dev-actions">
    <button type="button" id="renderBtn">Render card</button>
    <button type="button" id="tearBtn">Preview: seal crack + tear</button>
    <button type="button" id="zoomBtn">Preview: zoom overlay</button>
    <button type="button" id="damagedBtn">Preview: damaged</button>
    <button type="button" id="compareBtn">Determinism check (console)</button>
    <button type="button" id="rackBtn">Preview: stamp rack (2 variants)</button>
  </div>
</div>

<div class="dev-stage" id="stage"></div>
<div class="dev-state-label" id="stateLabel"></div>

<div class="zoom-overlay" id="zoomOverlay">
  <div class="zoom-panel" role="dialog" aria-modal="true" aria-label="Stamp and postmark detail">
    <button type="button" class="zoom-close" id="zoomClose" aria-label="Close">✕</button>
    <div class="zoom-stamp-wrap" id="zoomStampWrap"></div>
    <div class="zoom-postmark-wrap" id="zoomPostmarkWrap"></div>
    <div class="zoom-caption-lines" id="zoomCaptionLines"></div>
  </div>
</div>

<script type="module">
import { buildCardElement } from '/js/render-card.js';
import { buildStampElement } from '/js/stamp.js';
import { renderPostmarkSVG, weatherWord } from '/js/postmark.js';

const stage = document.getElementById('stage');
const stateLabel = document.getElementById('stateLabel');
const form = document.getElementById('devForm');

function payloadFromForm() {
  const fd = new FormData(form);
  const payload = {
    v: 1,
    m: fd.get('m'),
    s: fd.get('s'),
    lat: parseFloat(fd.get('lat')),
    lng: parseFloat(fd.get('lng')),
    pl: fd.get('pl'),
    co: fd.get('co'),
    d: fd.get('d'),
    t: fd.get('t'),
  };
  const ti = fd.get('ti');
  if (ti) payload.ti = ti;
  const to = fd.get('to');
  if (to) payload.to = to;
  const ink = parseInt(fd.get('ink'), 10);
  if (ink) payload.ink = ink;
  const sv = parseInt(fd.get('sv'), 10);
  if (sv) payload.sv = sv;
  const fl = parseInt(fd.get('fl'), 10);
  if (fl) payload.fl = fl;
  const fr = fd.get('fr');
  if (fr) payload.fr = fr;
  const wt = fd.get('wt');
  if (wt !== '') {
    payload.wt = parseInt(wt, 10);
    payload.wc = parseInt(fd.get('wc'), 10);
  }
  return payload;
}

function renderCard() {
  stage.innerHTML = '';
  stateLabel.textContent = 'card';
  const payload = payloadFromForm();
  const { root } = buildCardElement(payload, { editable: false });
  stage.appendChild(root);
}

function renderTear() {
  stage.innerHTML = '';
  stateLabel.textContent = 'seal crack → tear → slide (1100ms scripted sequence)';
  const scene = document.createElement('div');
  scene.className = 'envelope-scene';
  scene.style.maxWidth = '480px';
  scene.innerHTML = `
    <div class="card-wrap"></div>
    <div class="envelope">
      <div class="envelope-texture" aria-hidden="true"></div>
      <div class="envelope-address">POST CARD</div>
      <div class="envelope-seal">
        <div class="seal-half seal-half-left"></div>
        <div class="seal-half seal-half-right"></div>
        <div class="dust-puff"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    </div>`;
  stage.appendChild(scene);

  const payload = payloadFromForm();
  const cardWrap = scene.querySelector('.card-wrap');
  const { root } = buildCardElement(payload, { editable: false });
  cardWrap.appendChild(root);

  const envelope = scene.querySelector('.envelope');
  envelope.classList.add('is-cracking');
  setTimeout(() => {
    envelope.classList.add('is-tearing');
    envelope.style.clipPath = 'polygon(0% 24%, 10% 34%, 20% 22%, 30% 31%, 40% 26%, 50% 33%, 60% 21%, 70% 30%, 80% 24%, 90% 33%, 100% 27%, 100% 100%, 0% 100%)';
    setTimeout(() => {
      envelope.classList.add('is-torn');
      cardWrap.classList.add('is-visible');
      cardWrap.classList.add('is-settling');
    }, 400);
  }, 250);
}

function renderZoomPreview() {
  const payload = payloadFromForm();
  const overlay = document.getElementById('zoomOverlay');
  const stampWrap = document.getElementById('zoomStampWrap');
  const postmarkWrap = document.getElementById('zoomPostmarkWrap');
  const captionLines = document.getElementById('zoomCaptionLines');
  stampWrap.innerHTML = '';
  stampWrap.appendChild(buildStampElement(payload));
  postmarkWrap.innerHTML = '';
  if (payload.d && payload.t) postmarkWrap.appendChild(renderPostmarkSVG(payload));
  const place = payload.co ? `${payload.pl}, ${payload.co}` : payload.pl;
  const lines = [`MAILED FROM ${place}`.toUpperCase()];
  if (payload.d) lines.push(new Date(payload.d).toDateString());
  if (payload.t) lines.push(`${payload.t} LOCAL TIME`);
  if (payload.wt !== undefined) {
    const word = weatherWord(payload.wc);
    lines.push(word ? `${payload.wt}°C · ${word}` : `${payload.wt}°C`);
  }
  captionLines.innerHTML = '';
  for (const line of lines) {
    const div = document.createElement('div');
    div.textContent = line;
    captionLines.appendChild(div);
  }
  overlay.classList.add('is-open');
}

function renderDamaged() {
  stage.innerHTML = '';
  stateLabel.textContent = 'damaged';
  const div = document.createElement('div');
  div.style.color = 'var(--ink)';
  div.textContent = "This one got damaged in the mail.";
  stage.appendChild(div);
}

document.getElementById('renderBtn').addEventListener('click', renderCard);
document.getElementById('tearBtn').addEventListener('click', renderTear);
document.getElementById('zoomBtn').addEventListener('click', renderZoomPreview);
document.getElementById('damagedBtn').addEventListener('click', renderDamaged);
document.getElementById('zoomClose').addEventListener('click', () => {
  document.getElementById('zoomOverlay').classList.remove('is-open');
});
document.getElementById('compareBtn').addEventListener('click', () => {
  const payload = payloadFromForm();
  const a = buildCardElement(payload, { editable: false }).card.outerHTML;
  const b = buildCardElement(payload, { editable: false }).card.outerHTML;
  console.log('Determinism check:', a === b ? 'PASS — identical markup' : 'FAIL — markup differs');
});
document.getElementById('rackBtn').addEventListener('click', () => {
  stage.innerHTML = '';
  stateLabel.textContent = 'stamp rack — 2 variants for these coords';
  const payload = payloadFromForm();
  const row = document.createElement('div');
  row.style.display = 'flex';
  row.style.gap = '16px';
  for (let sv = 0; sv < 2; sv++) {
    const wrap = document.createElement('div');
    wrap.style.width = '90px';
    wrap.appendChild(buildStampElement(payload, sv));
    row.appendChild(wrap);
  }
  stage.appendChild(row);
});

renderCard();
</script>
</body>
</html>
